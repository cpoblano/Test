<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Test</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }
        body {
            background: #000000;
        }
canvas {
    background: #000000;
    display: block;
    margin: 0 auto;
}

#minerButton {
    background: rgb(75, 75, 75);
    color: white;
    border: 2px solid white;
    font-size: 20px;
    padding: 10px 20px;
    font-size: 20px;
    cursor: pointer;

    position: absolute;
    left: 16%;
    top: 300px;
    transform: translate(-50%, -50%);
}

#clickGoldButton {
    background: rgb(75, 75, 75);
    color: white;
    border: 2px solid white;
    font-size: 20px;
    padding: 10px 20px;
    cursor: pointer;

    position: absolute;
    left: 16%;
    top: 400px;
    transform: translate(-50%, -50%);
}

#resetButton {
    background: rgb(150, 50, 50);
    color: white;
    border: 2px solid white;
    font-size: 16px;
    padding: 8px 16px;
    cursor: pointer;

    position: absolute;
    right: 20px;
    top: 20px;
}
    </style>
    </head>
    <body>
        <canvas id="myCanvas" width="1500" height="680"></canvas>

        <button id="minerButton">Hire A Miner</button>
        <button id="clickGoldButton">Gain Gold</button>
        <button id="resetButton">Reset Progress</button>

        <script>
            //Javascript
            let gold = 0;
            let miners = 0;
            let keys = {
                space: false
            };

            let previousSpaceState = false;
            let goldTimer = 0;
            let lastTime = 0;
            let minerCost = 10;

            // ===== LOCAL STORAGE FUNCTIONS =====
            function saveProgress() {
                const gameData = {
                    gold: gold,
                    miners: miners,
                    minerCost: minerCost,
                    timestamp: new Date().toISOString()
                };
                localStorage.setItem('gameProgress', JSON.stringify(gameData));
                console.log('Progress saved:', gameData);
            }

            function loadProgress() {
                const saved = localStorage.getItem('gameProgress');
                if (saved) {
                    try {
                        const gameData = JSON.parse(saved);
                        gold = gameData.gold || 0;
                        miners = gameData.miners || 0;
                        minerCost = gameData.minerCost || 10;
                        console.log('Progress loaded:', gameData);
                    } catch (e) {
                        console.error('Failed to load progress:', e);
                    }
                }
            }

            function resetProgress() {
                if (confirm('Are you sure you want to reset all progress? This cannot be undone!')) {
                    localStorage.removeItem('gameProgress');
                    gold = 0;
                    miners = 0;
                    minerCost = 10;
                    console.log('Progress reset');
                }
            }

            // Load progress when page loads
            loadProgress();

            // Save progress every 5 seconds
            setInterval(saveProgress, 5000);

            // Also save when user leaves the page
            window.addEventListener('beforeunload', saveProgress);

            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space') keys.space = true;
            });
             window.addEventListener('keyup', (e) => {
                if (e.code === 'Space') keys.space = false;
            });

                const canvas= document.getElementById("myCanvas");
                const ctx = canvas.getContext('2d');

                const minerButton = document.getElementById("minerButton");
                const clickGoldButton = document.getElementById("clickGoldButton");
                const resetButton = document.getElementById("resetButton");

             //===Update the gold count===\\
                function updateGold(deltaTime){ 
                if (keys.space && !previousSpaceState) {
                    gold +=1;
                }
                previousSpaceState = keys.space;

                goldTimer += deltaTime;

                if (goldTimer >= 1) {
                    gold += miners;
                    goldTimer -= 1;
                }
            }

            minerButton.addEventListener('click', () => {
                if (gold >= minerCost) {
                    gold -= minerCost;
                    miners += 1;
                    minerCost = Math.floor(minerCost * 1.15); // Increase cost for next miner
                    saveProgress(); // Save immediately when buying miner
                }
            });

            clickGoldButton.addEventListener('click', () => {
                gold += 1;
            });

            resetButton.addEventListener('click', resetProgress);

            function drawUI(){
              {  ctx.font = `40px Stencil Std` ;
                ctx.fillStyle = 'white';
                ctx.fillText(`Gold = ${gold}`, 175, 100);}
              {   ctx.font = `20px Stencil Std` ;
                ctx.fillStyle = 'white';
                ctx.fillText(`Miners = ${miners}`, 200, 150);}
                {   ctx.font = `20px Stencil Std` ;
                ctx.fillStyle = 'white';
                ctx.fillText(`Miner Cost = ${minerCost} Gold`, 160, 200);}
            }

            function drawGame(){
                 // Put game drawing code here 
                 ctx.strokeStyle = "#474747";
              ctx.fillStyle = "#474747";
                 ctx.beginPath();
                 ctx.roundRect(-50, 0, 500, 750, [40]);
                 ctx.fill();
                 ctx.stroke();
            }

            function animate(currentTime) {
                const deltaTime = (currentTime - lastTime) / 1000; // Convert to seconds
                lastTime = currentTime;
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                updateGold(deltaTime);
                drawGame();
                drawUI();

                requestAnimationFrame(animate);
            }

            requestAnimationFrame(animate);
                
        </script>
    </body>
    </html>
