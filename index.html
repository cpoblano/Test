<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Test</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }
canvas {
    background: #000000;
    display: block;
    margin: 0 auto;
}
    </style>
    </head>
    <body>
        <canvas id="myCanvas" width="1300" height="600"></canvas>

        <script>
            //Javascript
            let souls = 0;
            let keys = {
                space: false
            };

            let previousSpaceState = false;

            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space') keys.space = true;
            });
             window.addEventListener('keyup', (e) => {
                if (e.code === 'Space') keys.space = false;
            });

                const canvas= document.getElementById("myCanvas");
                const ctx = canvas.getContext('2d');

                function animate() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.font = '40px Stencil Std' ;
                ctx.fillStyle = 'white' ;
                
                if (keys.space && !previousSpaceState) {
                    souls +=1;
                }
                previousSpaceState = keys.space;

                ctx.fillText(`Souls = ${souls}`, 650, 100);

                requestAnimationFrame(animate);
            }
            requestAnimationFrame(animate);
                
        </script>
    </body>
    </html>
